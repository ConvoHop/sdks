# Maven group for every published module. If the convohop.com domain is not
# verified for Maven Central by release time, change it to io.github.convohop
# here; Java and Kotlin package names stay com.convohop.
group=com.convohop
version=0.1.0-SNAPSHOT

org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.java.installations.auto-download=false
kotlin.compiler.execution.strategy=in-process
