[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threadwave-python-sdk"
version = "0.2.0"
description = "Async Python GraphQL SDK for the communications platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27,<1",
    "websockets>=15,<16",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["threadwave", "threadwave.*"]
namespaces = false

[tool.setuptools.package-data]
threadwave = ["py.typed"]
