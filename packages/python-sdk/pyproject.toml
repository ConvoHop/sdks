[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "convohop-sdk"
version = "0.2.0"
description = "Async Python GraphQL SDK for ConvoHop-compatible services"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27,<1",
    "websockets>=15,<16",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["convohop", "convohop.*"]
namespaces = false

[tool.setuptools.package-data]
convohop = ["py.typed"]
