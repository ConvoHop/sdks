# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
# Shared machines and CI runners: keep Gradle's footprint bounded.
org.gradle.workers.max=2

# AndroidX package structure.
android.useAndroidX=true

# The architectures to build. Override from the command line with -PreactNativeArchitectures=arm64-v8a.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# React Native's New Architecture: TurboModules and the Fabric renderer. @convohop/react-native requires it.
newArchEnabled=true

# Use Hermes, React Native's JavaScript engine.
hermesEnabled=true

# Draw behind the system bars.
edgeToEdgeEnabled=true

# Opt out of built-in Kotlin and the new DSL that ship with AGP 9, as React Native's template does.
android.builtInKotlin=false
android.newDsl=false
