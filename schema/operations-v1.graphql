query CommunicationCapabilities($context: RequestContextInput!) {
  capabilities(context: $context) {
    status
    requestId
    serverTime
    receiptId
    committedAt
    replayed
    operation {
      operationId
      owner
      href
      state
    }
    resourceRef {
      kind
      id
    }
    result {
      contractVersion
      serverRelease
      publicApiVersion
      wssVersions
      capabilityRevision
      limitsRevision
      features {
        chat
        inbox
        lexicalSearch
        typing
        webhooks
        liveSessions
        liveBroadcast
      }
      limits {
        key
        value {
          maximum
          unit
          scope
          milliseconds
          policyId
          revision
        }
      }
      environment
      productionQualified
      mediaPolicy {
        leasePolicyId
        leaseProtocolVersion
        maxLeaseMs
        renewAttemptMs
        preludeMaxBytes
        preludeTimeoutMs
        clockProfileId
      }
      geoControlAuthorityId
      offerings
      geos
      installationProfiles
      portalIdentity
    }
  }
}

