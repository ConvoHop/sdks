query CommunicationCapabilities($context: RequestContextInput!) {
  capabilities(context: $context) {
    status
    requestId
    serverTime
    receiptId
    committedAt
    replayed
    operation {
      operationId
      owner
      href
      state
    }
    resourceRef {
      kind
      id
    }
    result {
      contractVersion
      serverRelease
      publicApiVersion
      wssVersions
      capabilityRevision
      limitsRevision
      features {
        chat
        inbox
        lexicalSearch
        typing
        foregroundCalls
        webhooks
