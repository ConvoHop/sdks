      }
      environment
      productionQualified
      mediaPolicy {
        leasePolicyId
        leaseProtocolVersion
        maxLeaseMs
        renewAttemptMs
        preludeMaxBytes
        preludeTimeoutMs
        clockProfileId
      }
      geoControlAuthorityId
      offerings
      geos
      installationProfiles
      portalIdentity
    }
  }
}

