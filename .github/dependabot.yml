# Dependabot version updates.
# Add an entry for each ecosystem when its language directory lands, for
# example pip, nuget, maven or gradle, gomod, swift and pub.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Libraries keep their declared ranges; only the lockfile moves unless a
    # new version falls outside the range.
    versioning-strategy: increase-if-necessary
    # @types/node follows the engines.node floor (22.x); bump it with the floor.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      npm-production:
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"

  # Tested TypeScript docs snippets (docs/languages/typescript/examples).
  # Major updates stay ungrouped so each one is checked against its quickstart,
  # for example the units of firebase-admin's ttl.
  - package-ecosystem: npm
    directory: /docs/languages/typescript/examples
    schedule:
      interval: weekly
    # @types/node follows the engines.node floor (22.x); bump it with the floor.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: docs
      include: scope
    groups:
      docs-typescript-examples:
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: /jvm
    schedule:
      interval: weekly
    # JUnit 6 needs Java 17, and the JVM SDK's tests run on Java 11.
    ignore:
      - dependency-name: "org.junit:junit-bom"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7
    # Gradle has no development dependency type, so test-only updates get
    # the fix prefix too.
    commit-message:
      prefix: fix
      include: scope
    groups:
      gradle:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The Python SDK (python/). It is a library: its declared ranges stay and
  # only uv.lock moves unless a new version falls outside a range.
  - package-ecosystem: uv
    directory: /python
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      uv-production:
        dependency-type: production
        update-types:
          - minor
          - patch
      uv-development:
        dependency-type: development
        update-types:
          - minor
          - patch

  # The .NET SDK (dotnet/). Directory.Packages.props holds every version.
  # NuGet has no development dependency type, so test-only updates get the
  # fix prefix too.
  - package-ecosystem: nuget
    directory: /dotnet
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
      include: scope
    groups:
      nuget:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The Go SDK (go/). It has no dependencies; this entry covers any it gains.
  # Go has no development dependency type, so every update gets the fix prefix.
  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
      include: scope
    groups:
      gomod:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Tested Python docs snippets (docs/languages/python/examples). They install
  # the SDK from python/. Major updates stay ungrouped so each one is checked
  # against its quickstart, for example the form of firebase-admin's Android
  # options.
  - package-ecosystem: uv
    directory: /docs/languages/python/examples
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: docs
      include: scope
    groups:
      docs-python-examples:
        update-types:
          - minor
          - patch

  # The Swift client SDK (swift/). SwiftPM has no development dependency type,
  # so test-only updates get the fix prefix too.
  - package-ecosystem: swift
    directory: /swift
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
      include: scope
    groups:
      swift:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
