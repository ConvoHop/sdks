# Dependabot version updates.
# Add an entry for each ecosystem when its language directory lands, for
# example pip, nuget, maven or gradle, gomod, swift and pub.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Libraries keep their declared ranges; only the lockfile moves unless a
    # new version falls outside the range.
    versioning-strategy: increase-if-necessary
    # @types/node follows the engines.node floor (22.x); bump it with the floor.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      npm-production:
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"

  # Tested TypeScript docs snippets (docs/languages/typescript/examples).
  # Major updates stay ungrouped so each one is checked against its quickstart,
  # for example the units of firebase-admin's ttl.
  - package-ecosystem: npm
    directory: /docs/languages/typescript/examples
    schedule:
      interval: weekly
    # @types/node follows the engines.node floor (22.x); bump it with the floor.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: docs
      include: scope
    groups:
      docs-typescript-examples:
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: /jvm
    schedule:
      interval: weekly
    # JUnit 6 needs Java 17, and the JVM SDK's tests run on Java 11.
    ignore:
      - dependency-name: "org.junit:junit-bom"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7
    # Gradle has no development dependency type, so test-only updates get
    # the fix prefix too.
    commit-message:
      prefix: fix
      include: scope
    groups:
      gradle:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The Python SDK (python/). It is a library: its declared ranges stay and
  # only uv.lock moves unless a new version falls outside a range.
  - package-ecosystem: uv
    directory: /python
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      uv-production:
        dependency-type: production
        update-types:
          - minor
          - patch
      uv-development:
        dependency-type: development
        update-types:
          - minor
          - patch

  # The .NET SDK (dotnet/). Directory.Packages.props holds every version.
  # NuGet has no development dependency type, so test-only updates get the
  # fix prefix too.
  - package-ecosystem: nuget
    directory: /dotnet
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
      include: scope
    groups:
      nuget:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The Go SDK (go/). It has no dependencies; this entry covers any it gains.
  # Go has no development dependency type, so every update gets the fix prefix.
  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
      include: scope
    groups:
      gomod:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Tested Python docs snippets (docs/languages/python/examples). They install
  # the SDK from python/. Major updates stay ungrouped so each one is checked
  # against its quickstart, for example the form of firebase-admin's Android
  # options.
  - package-ecosystem: uv
    directory: /docs/languages/python/examples
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: docs
      include: scope
    groups:
      docs-python-examples:
        update-types:
          - minor
          - patch

  # The Android SDK's own Gradle build (android/), including its wrapper. It
  # also covers the docs extractor (tools/docgen/extractors/android) and the
  # docs examples (docs/languages/android/examples), which the build
  # includes and which take their versions from android/gradle/libs.versions.toml.
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    # Each update below would raise a consumer floor in android/README.md or
    # change the public API, so it needs its own change with the README.
    ignore:
      # Kotlin 2.3 deprecates language version 2.0, which
      # convohop-android-push compiles for with warnings as errors. The other
      # modules don't pin a language version, so a newer compiler also raises
      # the Kotlin that apps need.
      - dependency-name: "org.jetbrains.kotlin.*"
        versions: [">= 2.3.0"]
      - dependency-name: "org.jetbrains.kotlin:*"
        versions: [">= 2.3.0"]
      # kotlinx-serialization 1.10 and later are built with Kotlin 2.3 and
      # bring kotlin-stdlib 2.3 to apps, so they move with Kotlin.
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-serialization-*"
        versions: [">= 1.10.0"]
      # androidx.core 1.15 and later need compileSdk 35 or later, and apps
      # that use only convohop-android-push compile against API 34.
      - dependency-name: "androidx.core:core"
        versions: [">= 1.15.0"]
      # OkHttpEngine and OkHttpRealtimeConnector take an OkHttpClient, so
      # OkHttp 5 changes the public API. okhttp-android 5.5 also needs
      # compileSdk 37.
      - dependency-name: "com.squareup.okhttp3:*"
        update-types: ["version-update:semver-major"]
      # The SDK compiles and tests against the oldest firebase-messaging that
      # apps may supply (see android/gradle/libs.versions.toml).
      - dependency-name: "com.google.firebase:firebase-messaging"
    cooldown:
      default-days: 7
    # Gradle has no development dependency type, so test-only updates get
    # the fix prefix too.
    commit-message:
      prefix: fix
      include: scope
    groups:
      android-gradle:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Tested .NET docs samples (docs/languages/dotnet/examples). They build the
  # SDK from dotnet/. Major updates stay ungrouped so each one is checked
  # against its quickstart, for example FirebaseAdmin's FCM targets.
  - package-ecosystem: nuget
    directory: /docs/languages/dotnet/examples
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: docs
      include: scope
    groups:
      docs-dotnet-examples:
        update-types:
          - minor
          - patch

  # The .NET docs extractor and its tests (tools/docgen/extractors/dotnet).
  # They only run in development and CI.
  - package-ecosystem: nuget
    directories:
      - /tools/docgen/extractors/dotnet/src
      - /tools/docgen/extractors/dotnet/test
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      docgen-dotnet:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The Flutter SDK (flutter/). Like the npm libraries, it keeps its declared
  # ranges: with no committed lockfile, an update changes pubspec.yaml only
  # when a new release falls outside its range.
  - package-ecosystem: pub
    directory: /flutter
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
      include: scope
    groups:
      pub-flutter:
        update-types:
          - minor
          - patch

  # The Flutter example app, the Dart conformance driver and the Dart docs
  # extractor (tools/docgen/extractors/dart). They only run in development and
  # CI.
  - package-ecosystem: pub
    directories:
      - /flutter/example
      - /conformance/drivers/dart
      - /tools/docgen/extractors/dart
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      pub-flutter-tools:
        update-types:
          - minor
          - patch

  # Tested Flutter docs samples (docs/languages/flutter/examples). They use the
  # SDK from flutter/ and, like it, commit no lockfile: the Flutter SDK pins
  # some of their packages, and CI tests them with the current stable release.
  # Major updates stay ungrouped so each one is checked against its quickstart.
  - package-ecosystem: pub
    directory: /docs/languages/flutter/examples
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: docs
      include: scope
    groups:
      docs-flutter-examples:
        update-types:
          - minor
          - patch

  # The Flutter SDK's Android plugin (flutter/android).
  - package-ecosystem: gradle
    directory: /flutter/android
    schedule:
      interval: weekly
    # Apps resolve at least the plugin's library versions. The README
    # documents firebase-messaging 25.1.2 (BoM 34.18.0) as the floor, and a
    # newer androidx.core can need a compileSdk above the plugin's 36. Raise
    # them by hand, with the README.
    ignore:
      - dependency-name: "androidx.core:core"
      - dependency-name: "com.google.firebase:firebase-installations"
      - dependency-name: "com.google.firebase:firebase-messaging"
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
      include: scope
    groups:
      gradle-flutter:
        update-types:
          - minor
          - patch

  # The Swift client SDK (swift/). SwiftPM has no development dependency type,
  # so test-only updates get the fix prefix too.
  - package-ecosystem: swift
    directory: /swift
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
      include: scope
    groups:
      swift:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
