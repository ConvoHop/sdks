# Dependabot version updates.
# Add an entry for each ecosystem when its language directory lands, for
# example pip, nuget, maven or gradle, gomod, swift and pub.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Libraries keep their declared ranges; only the lockfile moves unless a
    # new version falls outside the range.
    versioning-strategy: increase-if-necessary
    # @types/node follows the engines.node floor (22.x); bump it with the floor.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      npm-production:
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"

  # Tested TypeScript docs snippets (docs/languages/typescript/examples).
  # Major updates stay ungrouped so each one is checked against its quickstart,
  # for example the units of firebase-admin's ttl.
  - package-ecosystem: npm
    directory: /docs/languages/typescript/examples
    schedule:
      interval: weekly
    # @types/node follows the engines.node floor (22.x); bump it with the floor.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: docs
      include: scope
    groups:
      docs-typescript-examples:
        update-types:
          - minor
          - patch
