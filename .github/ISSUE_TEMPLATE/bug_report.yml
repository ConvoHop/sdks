name: Bug report
description: Report a defect in an SDK, its generated code or its documentation.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Found a security issue?** Don't file it here. Report it privately as described in [SECURITY.md](https://github.com/ConvoHop/sdks/blob/main/SECURITY.md).

        Never paste tokens, backend keys, session credentials or personal data. Redact them from code, logs and screenshots.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Server SDK
        - Client SDK
        - Code generation or schema
        - Documentation
        - Build, CI or tooling
        - Other
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: Package and version
      description: The package name and version, or the commit SHA if you built from source.
      placeholder: "@convohop/client 0.1.0, or commit 1a2b3c4"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Runtime, operating system and, for client issues, the browser or device.
      placeholder: |
        Node.js 24.10 on Ubuntu 24.04
        Chrome 141 on macOS
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A minimal code sample or numbered steps. Redact credentials.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Logs or error output with credentials redacted. This is shown as code, so you don't need backticks.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues, and this isn't a duplicate.
          required: true
        - label: I removed tokens, keys and personal data from this report.
          required: true
