name: NuGet release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Preparation version on main; leave empty on a dotnet-v<version> tag.
        default: ""
        type: string
      publish:
        description: Publish the tagged release after registry setup and environment approval.
        default: false
        type: boolean
      confirmation:
        description: "For publication only: publish nuget <version>"
        default: ""
        type: string

permissions: {}

concurrency:
  group: registry-nuget
  cancel-in-progress: false

jobs:
  prepare:
    permissions:
      contents: read
    uses: ./.github/workflows/registry-prepare.yml # zizmor: ignore[self-repository] Same-commit syntax; actionlint does not yet parse $/.
    with:
      registry: nuget
      version: ${{ inputs.version }}
      publish: ${{ inputs.publish }}
      confirmation: ${{ inputs.confirmation }}

  publish:
    name: Publish Relay to NuGet
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: ${{ runner.temp }}/registry-assets
      - name: Verify artifacts and require a NuGet profile name, not an email
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          node scripts/release/registry.mjs verify --registry nuget --version "$VERSION" \
            --sha "$SOURCE_SHA" --source-ref "$GITHUB_REF" --directory "$RUNNER_TEMP/registry-assets"
          if [[ -z "$NUGET_USER" || "$NUGET_USER" == *"@"* ]]; then
            echo "::error::Set the NUGET_USER repository variable to the NuGet profile name, not an email address."
            exit 1
          fi
      - id: login
        name: Obtain a short-lived NuGet key with OIDC
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push the package and its matching symbol package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "$RUNNER_TEMP/registry-assets/InstantRelay.$VERSION.nupkg"
          --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"
