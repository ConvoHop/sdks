name: SDK CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    name: TypeScript packages (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Supported Node.js lines: Active LTS and Maintenance LTS.
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:graphql
      - name: Build and test core, client and server
        run: npm test
      - name: Check package metadata with publint and attw
        run: npm run check:packages
