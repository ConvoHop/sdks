name: SDK CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    name: TypeScript packages (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Supported Node.js lines: Active LTS and Maintenance LTS.
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check that every schema operation is annotated
        run: npm run check:annotations
      - name: Check generated IR, TypeScript, operations and doc snippets
        run: npm run check:graphql
      - name: Build and test core, client, server, sdkgen and the conformance harness
        run: npm test
      - name: Check package metadata with publint and attw
        run: npm run check:packages
      - name: Test the release scripts and configuration
        run: npm run check:release
      # Node 22 bundles npm 10; trusted publishing needs npm 11.5.1 or later.
      - name: Pack, inspect and dry-run publish core, client and server
        if: matrix.node == '24'
        run: |
          node scripts/release/assets.mjs --out "$RUNNER_TEMP/release-assets"
          node scripts/release/publish.mjs --dry-run --skip-published --assets "$RUNNER_TEMP/release-assets"
