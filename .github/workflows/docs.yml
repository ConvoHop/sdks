# Tests the docs generator, checks that docs/site matches its inputs, and
# checks the TypeScript surface and snippets. Each other language checks its
# own surface and snippets in its SDK workflow, where its toolchain is
# installed; see docs/docs-pipeline.md.
name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    name: Docs (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Supported Node.js lines: Active LTS and Maintenance LTS.
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/languages/typescript/examples/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Test the docs generator
        run: npm run test:docgen
      - name: Check that docs/site matches the IR, surfaces, pages and snippets
        run: npm run check:docs
      - name: Build the TypeScript packages
        run: npm run build
      - name: Check that the TypeScript surface matches the built declarations
        run: npm run extract:docs -- --check typescript
      - name: Type-check and run the TypeScript snippets
        run: npm run test:docs -- --install typescript
