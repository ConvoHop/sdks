# Builds and tests the Java and Kotlin server SDK in jvm/: its generated code
# and generator goldens, the Gradle build (Java 11 bytecode, compiled on JDK
# 17), the tests on Java 11, 17, 21 and 25, a dry-run publication to a local
# Maven repository, the conformance scenarios through the JVM driver, and the
# Java and Kotlin docs' surface and tested examples. See jvm/README.md and
# docs/docs-pipeline.md.
name: JVM

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/jvm.yml
      - conformance/**
      - docs/languages/jvm/**
      - jvm/**
      - schema/**
      - spec/**
      - tools/docgen/**
      - tools/sdkgen/**
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/jvm.yml
      - conformance/**
      - docs/languages/jvm/**
      - jvm/**
      - schema/**
      - spec/**
      - tools/docgen/**
      - tools/sdkgen/**

permissions: {}

jobs:
  build:
    name: Generate, build and publish locally
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check the generated code, including the Java and Kotlin APIs
        run: npm run check:graphql
      - name: Test the generators against their golden files
        run: npm run test:sdkgen
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            jvm/**/*.gradle.kts
            jvm/gradle/libs.versions.toml
            jvm/gradle/wrapper/gradle-wrapper.properties
            conformance/drivers/jvm/build.gradle.kts
            docs/languages/jvm/examples/build.gradle.kts
            tools/docgen/extractors/jvm/build.gradle.kts
      # The test job runs the tests on every supported Java version.
      - name: Compile, lint, document and package
        working-directory: jvm
        run: ./gradlew --no-daemon --console=plain build -x test
      - name: Publish to a local Maven repository (dry run)
        working-directory: jvm
        run: ./gradlew --no-daemon --console=plain publishToMavenLocal -Dmaven.repo.local="$PWD/build/m2"
      - name: Check the publications and their Java 11 bytecode
        working-directory: jvm
        run: |
          group="$(sed -n 's/^group=//p' gradle.properties)"
          version="$(sed -n 's/^version=//p' gradle.properties)"
          python3 - "build/m2/${group//.//}" "$version" <<'EOF'
          import pathlib, sys, zipfile
          root, version = pathlib.Path(sys.argv[1]), sys.argv[2]
          for module in ("convohop-server", "convohop-server-kotlin"):
              base = root / module / version / f"{module}-{version}"
              for suffix in (".pom", ".module", ".jar", "-sources.jar", "-javadoc.jar"):
                  if not pathlib.Path(f"{base}{suffix}").is_file():
                      sys.exit(f"missing {base}{suffix}")
              with zipfile.ZipFile(f"{base}.jar") as jar:
                  classes = [name for name in jar.namelist() if name.endswith(".class")]
                  newer = [name for name in classes if jar.read(name)[6:8] != b"\x00\x37"]
              if not classes or newer:
                  sys.exit(f"{module}: expected Java 11 bytecode (class file major version 55): {newer[:5]}")
              print(f"{module}: {len(classes)} classes, all Java 11 bytecode")
          EOF
      - name: Upload the local Maven repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jvm-maven-local
          path: jvm/build/m2/
          if-no-files-found: error
          retention-days: 14
      # The docs steps need Node.js and npm ci, so they run here rather than in the test job.
      - name: Test the docs surface extractor
        working-directory: jvm
        run: ./gradlew --no-daemon --console=plain :docs-surface:test
      - name: Check that the docs surface matches the SDK sources
        run: node tools/docgen/cli.mjs extract --check jvm
      - name: Compile and run the docs examples against the conformance mock
        run: node tools/docgen/cli.mjs test --install jvm
      - name: Upload the docs test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jvm-docs-test-reports
          path: |
            docs/languages/jvm/examples/build/reports/tests/
            docs/languages/jvm/examples/build/test-results/
            tools/docgen/extractors/jvm/build/reports/tests/
            tools/docgen/extractors/jvm/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  test:
    name: Tests (Java ${{ matrix.java }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # check out the repository
    strategy:
      fail-fast: false
      matrix:
        # Java 11 is the minimum; the others are the later LTS releases.
        java: ["11", "17", "21", "25"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Set up the JDK that runs the tests
        id: test-jdk
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          set-default: false
      # Gradle and the compilers run on JDK 17.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            jvm/**/*.gradle.kts
            jvm/gradle/libs.versions.toml
            jvm/gradle/wrapper/gradle-wrapper.properties
            conformance/drivers/jvm/build.gradle.kts
            docs/languages/jvm/examples/build.gradle.kts
            tools/docgen/extractors/jvm/build.gradle.kts
      # The build job tests the docs projects: the extractor runs on JDK 17, and
      # the examples' tests start the conformance mock with Node.js.
      - name: Run the tests
        working-directory: jvm
        env:
          TEST_JAVA: ${{ matrix.java }}
          TEST_JDK: ${{ steps.test-jdk.outputs.path }}
        run: >-
          ./gradlew --no-daemon --console=plain test
          -PtestJavaVersion="$TEST_JAVA"
          -Porg.gradle.java.installations.paths="$TEST_JDK"
          -x :docs-surface:test -x :docs-examples:test
      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jvm-test-reports-java-${{ matrix.java }}
          path: |
            jvm/*/build/reports/tests/
            jvm/*/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  conformance:
    name: JVM driver (mock target)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            jvm/**/*.gradle.kts
            jvm/gradle/libs.versions.toml
            jvm/gradle/wrapper/gradle-wrapper.properties
            conformance/drivers/jvm/build.gradle.kts
            docs/languages/jvm/examples/build.gradle.kts
            tools/docgen/extractors/jvm/build.gradle.kts
      - name: Build the JVM driver
        working-directory: jvm
        run: ./gradlew --no-daemon --console=plain :conformance-driver:installDist
      - name: Run the conformance scenarios against the mock target
        # Not --strict: a server SDK declares no user role, so the runner skips
        # the scenarios that only use user clients. Until the SDK follows the
        # recovery journal rules (spec/recovery/README.md), it also skips those that
        # need recovery.eviction. The next step allows only those.
        run: >-
          npm run conformance --
          --driver conformance/drivers/jvm/build/install/conformance-driver/bin/conformance-driver
          --reports conformance/reports/jvm
      - name: Fail on any other skip
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs";
          const allowed = new Set([
            "it only uses user clients, which the driver under test does not declare",
            "driver convohop-jvm does not declare feature recovery.eviction",
          ]);
          const summary = JSON.parse(readFileSync("conformance/reports/jvm/summary.json", "utf8"));
          const scenarios = summary.suites.flatMap((suite) => suite.scenarios);
          const passed = scenarios.filter((scenario) => scenario.status === "passed");
          const other = scenarios.filter((scenario) => scenario.status !== "passed"
            && !(scenario.status === "skipped" && allowed.has(scenario.reason)));
          for (const scenario of other) {
            console.log(`::error::${scenario.id} ${scenario.status}: ${scenario.reason ?? "no reason"}`);
          }
          console.log(`${summary.driver.name}: ${passed.length} of ${scenarios.length} passed`);
          if (summary.driver.name !== "convohop-jvm" || passed.length === 0 || other.length > 0) process.exit(1);
          EOF
      - name: Upload JUnit and summary reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-reports-jvm-mock
          path: conformance/reports/jvm/
          if-no-files-found: ignore
          retention-days: 14

  # Like the dev-stack job in conformance.yml, runs the scenarios against the
  # ConvoHop dev stack: the private, development-only linux/arm64 image that
  # runs the whole platform in one container (see spec/conformance/targets.md),
  # which conformance/dev-stack.mjs starts. The job runs only when the
  # CONVOHOP_DEV_STACK_IMAGE repository variable names the image, and never for
  # pull requests from forks, which cannot pull it.
  conformance-dev-stack:
    name: JVM driver (dev stack)
    if: vars.CONVOHOP_DEV_STACK_IMAGE != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read # check out the repository
      packages: read # pull the dev-stack image from GitHub Packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            jvm/**/*.gradle.kts
            jvm/gradle/libs.versions.toml
            jvm/gradle/wrapper/gradle-wrapper.properties
            conformance/drivers/jvm/build.gradle.kts
            docs/languages/jvm/examples/build.gradle.kts
            tools/docgen/extractors/jvm/build.gradle.kts
      - name: Build the JVM driver
        working-directory: jvm
        run: ./gradlew --no-daemon --console=plain :conformance-driver:installDist
      - name: Start the dev stack
        env:
          CONVOHOP_DEV_STACK_IMAGE: ${{ vars.CONVOHOP_DEV_STACK_IMAGE }}
          GITHUB_TOKEN: ${{ github.token }}
        # Pulls the image with the job's token, waits until the stack is ready and exports
        # the seed.env values that conformance/targets/dev-stack.json reads, masking its credentials.
        run: node conformance/dev-stack.mjs start
      - name: Run the conformance scenarios against the dev stack
        run: >-
          npm run conformance --
          --target conformance/targets/dev-stack.json
          --driver conformance/drivers/jvm/build/install/conformance-driver/bin/conformance-driver
          --reports conformance/reports/jvm-dev-stack
      - name: Show why the dev stack stopped
        if: failure()
        # This repository's logs are public, so it prints only the stack supervisor's lines, not the platform's logs.
        run: node conformance/dev-stack.mjs logs
      - name: Upload JUnit and summary reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-reports-jvm-dev-stack
          path: conformance/reports/jvm-dev-stack/
          if-no-files-found: ignore
          retention-days: 14
