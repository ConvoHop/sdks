# Runs the language-neutral conformance scenarios in spec/conformance through
# the TypeScript reference driver and uploads the JUnit and summary reports.
# See spec/conformance/README.md and spec/conformance/targets.md.
name: Conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  mock:
    name: TypeScript reference driver (mock target)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run the conformance scenarios against the mock target
        # --strict: the mock offers every capability and the reference driver every feature, so a skip is a failure.
        run: npm run conformance -- --strict
      - name: Upload JUnit and summary reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-reports-mock
          path: conformance/reports/
          if-no-files-found: ignore
          retention-days: 14

  # Runs the suite against the ConvoHop dev stack: the private, development-only
  # linux/arm64 image that runs the whole platform in one container (see
  # spec/conformance/targets.md). conformance/dev-stack.mjs starts the stack and
  # shows why it stopped; every dev-stack job, here and in the SDK workflows,
  # uses it. The job runs only when the CONVOHOP_DEV_STACK_IMAGE repository
  # variable names the image, and never for pull requests from forks, which
  # cannot pull it.
  dev-stack:
    name: TypeScript reference driver (dev stack)
    if: vars.CONVOHOP_DEV_STACK_IMAGE != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read # check out the repository
      packages: read # pull the dev-stack image from GitHub Packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Start the dev stack
        env:
          CONVOHOP_DEV_STACK_IMAGE: ${{ vars.CONVOHOP_DEV_STACK_IMAGE }}
          GITHUB_TOKEN: ${{ github.token }}
        # Pulls the image with the job's token, waits until the stack is ready and exports
        # the seed.env values that conformance/targets/dev-stack.json reads, masking its credentials.
        run: node conformance/dev-stack.mjs start
      - name: Run the conformance scenarios against the dev stack
        run: npm run conformance -- --target conformance/targets/dev-stack.json
      - name: Show why the dev stack stopped
        if: failure()
        # This repository's logs are public, so it prints only the stack supervisor's lines, not the platform's logs.
        run: node conformance/dev-stack.mjs logs
      - name: Upload JUnit and summary reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-reports-dev-stack
          path: conformance/reports/
          if-no-files-found: ignore
          retention-days: 14
