# Release pipeline for the npm packages. npm publishing is a dry run until
# REL-PUB; see RELEASING.md.
#
# Every push to main runs release-please, which keeps the release PR up to
# date. Merging the release PR makes the next run tag the release commit and
# create draft GitHub Releases. The run then rebuilds and checks that commit,
# packs each released package with an SBOM and SHA256SUMS, attests them,
# attaches everything to the drafts, dry-runs npm publish in the `npm`
# environment and finally publishes the drafts.
#
# A run only builds releases tagged at the commit it was triggered for, so the
# provenance names the release commit and its own copy of this workflow. To
# recover a failed or cancelled release, re-run the failed jobs or run this
# workflow on the release tag:
#   gh workflow run release.yml --ref core-v0.1.0
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR and tags
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create release tags and draft GitHub Releases
      issues: write # label the release PR
      pull-requests: write # open and update the release PR
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      release: ${{ toJSON(steps.release.outputs) }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  plan:
    name: Plan
    needs: release-please
    if: ${{ !cancelled() && ((github.event_name == 'push' && needs.release-please.result == 'success' && needs.release-please.outputs.releases_created == 'true') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      releases: ${{ steps.plan.outputs.releases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - id: plan
        name: Find the releases tagged at this commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_OUTPUTS: ${{ needs.release-please.outputs.release }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/plan.mjs

  build:
    name: Build, check and pack
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.assets.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check that every schema operation is annotated
        run: npm run check:annotations
      - name: Check generated IR, TypeScript, operations and doc snippets
        run: npm run check:graphql
      - name: Build and test every package
        run: npm test
      - name: Check package metadata with publint and attw
        run: npm run check:packages
      - name: Test the release scripts and configuration
        run: npm run check:release
      - id: assets
        name: Pack the released packages with SBOMs and SHA256SUMS
        env:
          RELEASES: ${{ needs.plan.outputs.releases }}
        run: node scripts/release/assets.mjs --out "$RUNNER_TEMP/release-assets"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: error
          overwrite: true

  attest:
    name: Attest ${{ matrix.package.name }}
    needs: [plan, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # sign the attestations with Sigstore
      attestations: write # store the attestations in this repository
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.build.outputs.packages) }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets
      - id: provenance
        name: Attest build provenance for the tarball, SBOM and SHA256SUMS
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-assets/${{ matrix.package.component }}/*
      - id: sbom
        name: Attest the SBOM for the tarball
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-assets/${{ matrix.package.component }}/${{ matrix.package.tarball }}
          sbom-path: ${{ runner.temp }}/release-assets/${{ matrix.package.component }}/${{ matrix.package.sbom }}
      - name: Verify the attestations as a consumer would
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ runner.temp }}/release-assets/${{ matrix.package.component }}/${{ matrix.package.tarball }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
          SOURCE_DIGEST: ${{ needs.plan.outputs.sha }}
        run: |
          verify() {
            gh attestation verify "$TARBALL" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$SOURCE_DIGEST" --deny-self-hosted-runners "$@"
          }
          verify --bundle "$PROVENANCE_BUNDLE"
          verify --bundle "$SBOM_BUNDLE" --predicate-type https://cyclonedx.org/bom
      - name: Collect the Sigstore bundles
        env:
          DIR: ${{ runner.temp }}/attestations/${{ matrix.package.component }}
          BASE: ${{ matrix.package.base }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          mkdir -p "$DIR"
          cp "$PROVENANCE_BUNDLE" "$DIR/$BASE.provenance.sigstore.json"
          cp "$SBOM_BUNDLE" "$DIR/$BASE.sbom.sigstore.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attestations-${{ matrix.package.component }}
          path: ${{ runner.temp }}/attestations
          if-no-files-found: error
          overwrite: true

  upload:
    name: Attach the assets to the draft releases
    needs: [plan, build, attest]
    if: ${{ !cancelled() && needs.attest.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # upload assets to the draft releases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: attestations-*
          merge-multiple: true
          path: ${{ runner.temp }}/attestations
      - name: Check and attach the assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PACKAGES: ${{ needs.build.outputs.packages }}
        run: >-
          node scripts/release/github-release.mjs upload
          --assets "$RUNNER_TEMP/release-assets"
          --attestations "$RUNNER_TEMP/attestations"

  npm:
    name: Publish to npm (dry run)
    needs: [plan, build, upload]
    if: ${{ !cancelled() && needs.upload.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # REL-PUB registers this workflow file and environment as the npm trusted
    # publisher for each package. See RELEASING.md.
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets
      - name: Dry-run npm publish of the attested tarballs
        env:
          RELEASE_PACKAGES: ${{ needs.build.outputs.packages }}
        run: node scripts/release/publish.mjs --dry-run --require-oidc --assets "$RUNNER_TEMP/release-assets"

  finalize:
    name: Publish the GitHub Releases
    needs: [plan, build, npm]
    if: ${{ !cancelled() && needs.npm.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # publish the draft releases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Publish the drafts once every asset is attached
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PACKAGES: ${{ needs.build.outputs.packages }}
        run: node scripts/release/github-release.mjs publish
