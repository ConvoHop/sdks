[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "convohop"
dynamic = ["version"]
description = "ConvoHop server SDK for Python: backend-key and management clients, webhook verification and push payloads."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The ConvoHop Authors" }]
keywords = ["convohop", "chat", "messaging", "graphql", "webhooks", "sdk"]
classifiers = [
  # Registry publishing is not approved yet; PyPI rejects uploads that carry this classifier.
  "Private :: Do Not Upload",
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Chat",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://github.com/ConvoHop/sdks/tree/main/python"
Source = "https://github.com/ConvoHop/sdks"
Issues = "https://github.com/ConvoHop/sdks/issues"

[dependency-groups]
dev = [
  "anyio>=4.6",
  "build>=1.2",
  "mypy>=1.15",
  "pytest>=8.3",
  "ruff>=0.15",
  "twine>=6.1",
]

[tool.hatch.version]
path = "src/convohop/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/convohop"]

[tool.hatch.build.targets.sdist]
# The tests read the repository's shared spec/ fixtures, so they run from a checkout, not from the sdist.
include = ["/src", "/README.md", "/LICENSE", "/NOTICE", "/pyproject.toml"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]
# Generated code is checked by the sdkgen goldens and drift check, not reformatted by hand.
extend-exclude = ["src/convohop/_generated"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PIE", "PT", "RET", "S", "BLE", "TRY", "PERF"]
ignore = [
  "TRY003", # Problems carry protocol messages by design.
  "TRY300",
  "S101",   # Tests use assert.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "PT011"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["convohop", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-p", "no:cacheprovider"]
xfail_strict = true
filterwarnings = ["error"]
