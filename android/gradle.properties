# Shared machines and CI runners: keep Gradle's footprint bounded.
org.gradle.jvmargs=-Xmx2g
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1g
android.useAndroidX=true
kotlin.code.style=official
# The SDK version; release tooling owns it once Android joins the release train.
convohopVersion=0.1.0-SNAPSHOT
